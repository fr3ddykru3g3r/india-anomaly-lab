[project]
name = "indialab"
version = "0.1.0"
description = "Honest backtests of Indian equity anomalies: point-in-time data, dated costs and taxes, published failures."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9", "pyarrow>=15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
